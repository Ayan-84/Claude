<!DOCTYPE html>
<!--
  REPORT TEMPLATE: TAM / SAM / SOM + Sensitivities + Why Now
  ─────────────────────────────────────────────────────────────
  Three-section single-page report with warm earth tone palette.

  SECTIONS:
    1. TAM / SAM / SOM  — concentric circles + sourced legend
    2. Sensitivities    — dumbbell range chart (bear / base / bull)
    3. Why Now          — 2×2 evidence cards

  HOW TO FILL IN:
    Search for every <!-- REPLACE: ... -- > comment and substitute
    your own values. The layout and styles need no changes.

  DUMBBELL BASE-DOT POSITIONING:
    Each base dot's `left` is a percentage of the track width,
    calculated as: (base - bear) / (bull - bear) × 100
    Example: bear=8%, base=15%, bull=25% → (15-8)/(25-8) = 41%
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REPLACE: page title -->
  <title>Report Title — Market Opportunity</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Warm earth tone palette ── */
      --bg:           #FAF6EE;   /* page background */
      --sand:         #F0E8D8;   /* card / row backgrounds */
      --border:       #D8C9B0;   /* dividers, borders */
      --orange-pale:  #F0C090;   /* bear dot, TAM circle fill */
      --orange:       #C85A24;   /* primary accent, base dot */
      --orange-deep:  #8A2E0C;   /* bull dot, SOM circle */
      --dark:         #2A1206;   /* headings, primary text */
      --muted:        #8A6858;   /* secondary text, sources */
      --body-text:    #3C1E0C;   /* body copy */
      --tam-fill:     #EDE0C8;   /* TAM (outer) circle */
      --sam-fill:     #C06028;   /* SAM (middle) circle */
      --som-fill:     #742008;   /* SOM (inner) circle */
    }

    body {
      background: var(--bg);
      color: var(--dark);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      padding: 60px 48px 88px;
      max-width: 1080px;
      margin: 0 auto;
    }

    /* ─── HEADER ──────────────────────────────────────────── */
    header { text-align: center; margin-bottom: 72px; }
    .eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 14px;
    }
    header h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 40px; font-weight: normal; color: var(--dark);
      line-height: 1.15; margin-bottom: 14px;
    }
    .subtitle {
      font-size: 14.5px; color: var(--muted);
      max-width: 500px; margin: 0 auto; line-height: 1.7;
    }

    /* ─── SECTION SHELL ───────────────────────────────────── */
    .section { margin-bottom: 72px; }
    .sec-eye {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--orange); margin-bottom: 5px;
    }
    .sec-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px; font-weight: normal; color: var(--dark);
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
      margin-bottom: 36px;
    }

    /* ─── SECTION 1: CONCENTRIC CIRCLES ──────────────────── */
    .tam-layout { display: flex; align-items: center; gap: 60px; flex-wrap: wrap; }

    .circles {
      position: relative; width: 360px; height: 360px; flex-shrink: 0;
    }
    .circle {
      position: absolute; border-radius: 50%;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .circle.tam { width: 360px; height: 360px; background: var(--tam-fill); border: 1.5px solid #CDBF9E; }
    .circle.sam { width: 224px; height: 224px; background: var(--sam-fill); }
    .circle.som { width:  96px; height:  96px; background: var(--som-fill); }

    /* Ring labels inside each visual zone */
    .rl {
      position: absolute; font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    }
    /* TAM label sits in the outer ring (above SAM circle top ≈ 68px) */
    .rl.tam { top: 24px; color: var(--muted); }
    /* SAM label sits between SAM top (68px) and SOM top (132px) */
    .rl.sam { top: 88px; color: rgba(255,255,255,0.75); }
    /* SOM label centered in the inner circle */
    .rl.som { top: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); }

    .tam-legend { flex: 1; min-width: 280px; }
    .tam-item { padding-left: 14px; border-left: 3px solid transparent; margin-bottom: 26px; }
    .tam-item:last-child { margin-bottom: 0; }
    .tam-item.tam { border-color: #CDAF82; }
    .tam-item.sam { border-color: var(--sam-fill); }
    .tam-item.som { border-color: var(--som-fill); }

    .ti-layer { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
    .ti-amount { font-family: Georgia, serif; font-size: 32px; color: var(--dark); line-height: 1.1; margin-bottom: 5px; }
    .ti-def    { font-size: 12.5px; color: var(--body-text); line-height: 1.55; margin-bottom: 5px; }
    .ti-source { font-size: 10px; color: var(--muted); font-style: italic; line-height: 1.5; }

    /* ─── SECTION 2: DUMBBELL CHART ──────────────────────── */
    .db-legend { display: flex; gap: 22px; margin-bottom: 18px; }
    .db-legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
    .db-legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.5); }

    .db-rows { border-top: 1px solid var(--border); }
    .db-row {
      display: grid; grid-template-columns: 205px 1fr 155px;
      align-items: center; gap: 20px; padding: 16px 0;
      border-bottom: 1px solid var(--sand);
    }
    .db-output {
      background: var(--sand); border-radius: 8px; padding: 16px 14px;
      border-bottom: none; margin-top: 10px;
    }

    .db-label { font-size: 13px; font-weight: 500; color: var(--dark); line-height: 1.3; }
    .db-sub   { font-size: 11px; color: var(--muted); font-weight: normal; margin-top: 2px; }

    .db-track-wrap { position: relative; padding-top: 22px; }

    /* Value labels float above the track */
    .db-vlabels { position: absolute; top: 0; left: 0; right: 0; height: 18px; }
    .db-vlabels span { position: absolute; font-size: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; line-height: 1; }
    .vl-bear { left: 0; }
    .vl-base { transform: translateX(-50%); }   /* left set inline per row */
    .vl-bull { right: 0; text-align: right; }

    .db-track { position: relative; height: 4px; background: var(--border); border-radius: 2px; }
    .db-fill  { position: absolute; inset: 0; border-radius: 2px; background: linear-gradient(to right, var(--orange-pale), var(--orange-deep)); }
    .db-dot   { position: absolute; width: 13px; height: 13px; border-radius: 50%; top: 50%; transform: translate(-50%, -50%); border: 2px solid var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    .db-dot.bear { left:   0%; background: var(--orange-pale); }
    .db-dot.base {            background: var(--orange); }      /* left set inline */
    .db-dot.bull { left: 100%; background: var(--orange-deep); }
    .db-output .db-dot { width: 15px; height: 15px; }

    .db-source { font-size: 10px; font-style: italic; color: var(--muted); line-height: 1.5; text-align: right; }

    /* ─── SECTION 3: EVIDENCE CARDS ──────────────────────── */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: var(--sand); border-radius: 10px; padding: 24px 20px; border-left: 4px solid var(--orange); }
    .card-tag  { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
    .card-head { font-family: Georgia, serif; font-size: 15.5px; line-height: 1.35; color: var(--dark); margin-bottom: 12px; }
    .card-stat { font-family: Georgia, serif; font-size: 40px; color: var(--orange-deep); line-height: 1; margin-bottom: 8px; }
    .card-body { font-size: 12.5px; color: var(--body-text); line-height: 1.65; margin-bottom: 14px; }
    .card-src  { font-size: 10px; font-style: italic; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; line-height: 1.5; }

    /* ─── FOOTER ──────────────────────────────────────────── */
    footer { text-align: center; font-size: 10px; color: var(--muted); padding-top: 24px; border-top: 1px solid var(--border); line-height: 1.7; }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══════════════════════════════════════════ -->
  <header>
    <div class="eyebrow"><!-- REPLACE: e.g. "Market Opportunity Analysis · May 2026" --></div>
    <h1><!-- REPLACE: Report headline --></h1>
    <p class="subtitle"><!-- REPLACE: One or two sentence description of the market and opportunity being sized. --></p>
  </header>


  <!-- ═══ SECTION 1: TAM / SAM / SOM ══════════════════════
       Concentric circles (visual) + sourced legend (content).
       The three circles are purely decorative — all numbers
       and definitions live in the .tam-legend to the right.
  ══════════════════════════════════════════════════════════ -->
  <div class="section">
    <div class="sec-eye">Market Sizing</div>
    <div class="sec-title">TAM · SAM · SOM</div>

    <div class="tam-layout">

      <div class="circles" aria-hidden="true">
        <div class="circle tam"></div>
        <div class="circle sam"></div>
        <div class="circle som"></div>
        <div class="rl tam">TAM</div>
        <div class="rl sam">SAM</div>
        <div class="rl som">SOM</div>
      </div>

      <div class="tam-legend">

        <div class="tam-item tam">
          <div class="ti-layer">TAM — Total Addressable Market</div>
          <div class="ti-amount"><!-- REPLACE: e.g. "$318B" --></div>
          <div class="ti-def"><!-- REPLACE: One sentence definition of the full market universe. --></div>
          <div class="ti-source"><!-- REPLACE: Source name, year · Methodology note --></div>
        </div>

        <div class="tam-item sam">
          <div class="ti-layer">SAM — Serviceable Addressable Market</div>
          <div class="ti-amount"><!-- REPLACE: e.g. "$127B" --></div>
          <div class="ti-def"><!-- REPLACE: One sentence definition of the reachable segment. --></div>
          <div class="ti-source"><!-- REPLACE: Source name, year · Methodology note --></div>
        </div>

        <div class="tam-item som">
          <div class="ti-layer">SOM — Serviceable Obtainable Market</div>
          <div class="ti-amount"><!-- REPLACE: e.g. "$250–400M" --></div>
          <div class="ti-def"><!-- REPLACE: One sentence definition of the realistically capturable portion. --></div>
          <div class="ti-source"><!-- REPLACE: Source name, year · Methodology note --></div>
        </div>

      </div>
    </div>
  </div>


  <!-- ═══ SECTION 2: SENSITIVITIES ════════════════════════
       One .db-row per input assumption, plus one .db-output
       row at the end for the derived revenue/output figure.

       For each row, set `left` on .vl-base and .db-dot.base
       using: (base - bear) / (bull - bear) × 100  →  as "%"
  ══════════════════════════════════════════════════════════ -->
  <div class="section">
    <div class="sec-eye">Risk &amp; Range</div>
    <div class="sec-title">Key Assumptions &amp; Sensitivities</div>

    <div class="db-legend">
      <div class="db-legend-item"><div class="db-legend-dot" style="background:var(--orange-pale)"></div> Bear case</div>
      <div class="db-legend-item"><div class="db-legend-dot" style="background:var(--orange)"></div> Base case</div>
      <div class="db-legend-item"><div class="db-legend-dot" style="background:var(--orange-deep)"></div> Bull case</div>
    </div>

    <div class="db-rows">

      <!-- ── Input assumption row (copy/paste to add more) ── -->
      <div class="db-row">
        <div class="db-label"><!-- REPLACE: Assumption name -->
          <div class="db-sub"><!-- REPLACE: Short clarifying note --></div>
        </div>
        <div class="db-track-wrap">
          <div class="db-vlabels">
            <span class="vl-bear"><!-- REPLACE: bear value --></span>
            <span class="vl-base" style="left:50%"><!-- REPLACE: base value --></span><!-- adjust left% -->
            <span class="vl-bull"><!-- REPLACE: bull value --></span>
          </div>
          <div class="db-track">
            <div class="db-fill"></div>
            <div class="db-dot bear"></div>
            <div class="db-dot base" style="left:50%"></div><!-- adjust left% -->
            <div class="db-dot bull"></div>
          </div>
        </div>
        <div class="db-source"><!-- REPLACE: Source, year --></div>
      </div>

      <!-- ── Duplicate the block above for each additional assumption ── -->

    </div><!-- /db-rows -->

    <!-- Output row — derived from assumptions above -->
    <div class="db-row db-output">
      <div class="db-label" style="font-weight:600"><!-- REPLACE: Output metric name (e.g. "SOM Revenue — Year 5") -->
        <div class="db-sub"><!-- REPLACE: e.g. "Combined hybrid model output" --></div>
      </div>
      <div class="db-track-wrap">
        <div class="db-vlabels">
          <span class="vl-bear"><!-- REPLACE: bear output --></span>
          <span class="vl-base" style="left:50%"><!-- REPLACE: base output --></span>
          <span class="vl-bull"><!-- REPLACE: bull output --></span>
        </div>
        <div class="db-track">
          <div class="db-fill"></div>
          <div class="db-dot bear"></div>
          <div class="db-dot base" style="left:50%"></div>
          <div class="db-dot bull"></div>
        </div>
      </div>
      <div class="db-source" style="font-style:normal;font-weight:500;color:var(--dark)">Derived from<br>assumptions above</div>
    </div>

  </div>


  <!-- ═══ SECTION 3: WHY NOW ═══════════════════════════════
       Four independent converging forces — not a sequence.
       Each card: tag → headline → bold stat → body → source.
  ══════════════════════════════════════════════════════════ -->
  <div class="section">
    <div class="sec-eye">Why Now</div>
    <div class="sec-title"><!-- REPLACE: e.g. "Four Converging Forces" --></div>

    <div class="cards">

      <div class="card">
        <div class="card-tag">01 · <!-- REPLACE: Force name --></div>
        <div class="card-head"><!-- REPLACE: One sentence claim backed by the stat below --></div>
        <div class="card-stat"><!-- REPLACE: The single most compelling number --></div>
        <div class="card-body"><!-- REPLACE: 2–3 sentence explanation of why this force matters now. --></div>
        <div class="card-src"><!-- REPLACE: Source name, year --></div>
      </div>

      <div class="card">
        <div class="card-tag">02 · <!-- REPLACE: Force name --></div>
        <div class="card-head"><!-- REPLACE: One sentence claim --></div>
        <div class="card-stat"><!-- REPLACE: Stat --></div>
        <div class="card-body"><!-- REPLACE: Explanation --></div>
        <div class="card-src"><!-- REPLACE: Source --></div>
      </div>

      <div class="card">
        <div class="card-tag">03 · <!-- REPLACE: Force name --></div>
        <div class="card-head"><!-- REPLACE: One sentence claim --></div>
        <div class="card-stat"><!-- REPLACE: Stat --></div>
        <div class="card-body"><!-- REPLACE: Explanation --></div>
        <div class="card-src"><!-- REPLACE: Source --></div>
      </div>

      <div class="card">
        <div class="card-tag">04 · <!-- REPLACE: Force name --></div>
        <div class="card-head"><!-- REPLACE: One sentence claim --></div>
        <div class="card-stat"><!-- REPLACE: Stat --></div>
        <div class="card-body"><!-- REPLACE: Explanation --></div>
        <div class="card-src"><!-- REPLACE: Source --></div>
      </div>

    </div>
  </div>


  <!-- ═══ FOOTER ════════════════════════════════════════════ -->
  <footer>
    <!-- REPLACE: "Data current as of [date] · Sources: ..." -->
  </footer>

</body>
</html>
